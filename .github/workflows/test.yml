name: Test

on:
  # Run on all master branch commits
  push:
    branches:
      - main

  # Run against all PRs (from the main repo, or forks)
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - '3.3'
          - '3.4'
          - '4.0'

    runs-on: ubuntu-latest
    env:
      MISE_RUBY_VERSION: ${{ matrix.ruby-version }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: jdx/mise-action@v5
    - name: Install dependencies
      run: bundle install
    - name: Run tests
      run: bundle exec rake
